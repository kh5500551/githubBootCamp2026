<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f3f5f8">
  <title>待辦清單</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="app-header">
      <div class="header-copy">
        <h1>待辦清單</h1>
        <p class="subtitle">把想做的事，一件一件完成。</p>
      </div>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false">
        <span id="theme-icon" aria-hidden="true">🌙</span>
        <span id="theme-label">深色模式</span>
      </button>
    </header>

    <form id="todo-form" class="todo-form" autocomplete="off">
      <label class="sr-only" for="todo-input">新增待辦事項</label>
      <input
        id="todo-input"
        class="todo-input"
        type="text"
        placeholder="例如：完成今天的閱讀"
        maxlength="200"
        required
      >
      <button class="btn-add" type="submit">新增</button>
    </form>

    <nav class="filter-bar" aria-label="篩選待辦事項">
      <button class="btn-filter is-active" type="button" data-filter="all" aria-pressed="true">全部</button>
      <button class="btn-filter" type="button" data-filter="active" aria-pressed="false">未完成</button>
      <button class="btn-filter" type="button" data-filter="completed" aria-pressed="false">已完成</button>
    </nav>

    <p id="storage-message" class="storage-message" role="status" hidden></p>
    <ul id="todo-list" class="todo-list" aria-label="待辦事項"></ul>
    <p id="empty-state" class="empty-state">還沒有任何待辦事項,新增一個吧!</p>

    <footer class="app-footer">
      <span id="remaining-count" aria-live="polite">未完成:0 項</span>
    </footer>
  </main>
</body>
</html>
